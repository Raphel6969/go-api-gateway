server:
  port: ":8080"

auth:
  jwt_secret: "super-secret-gateway-key-32-bytes"
  api_keys:
    "key-client-123": "user_api_partner_1"
    "key-admin-456": "admin_user"

rate_limit:
  capacity: 5
  refill_rate: 1.0

cache:
  ttl_seconds: 30

routes:
  - path: "/users"
    targets:
      - "http://backend1:8081"   # Changed from localhost
      - "http://backend2:8082"   # Changed from localhost
    public: false
  
  # Note: If you want to keep this /public route, you will also 
  # need to add a 'backend3' to your docker-compose.yml!
  - path: "/public"
    targets:
      - "http://backend3:8083"   # Changed from localhost
    public: true
